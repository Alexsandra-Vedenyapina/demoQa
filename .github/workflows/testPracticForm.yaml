
name: Test and Allure Report

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    
    # КРИТИЧЕСКИ ВАЖНО: без этого шага деплой на gh-pages будет падать с 403
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Start Selenoid
        uses: Xotabu4/selenoid-github-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ВАЖНО: запускаем тесты И сразу генерируем HTML-отчёт одной командой
      # Задача allureReport создаст папку build/allure-report/index.html
      - name: Run tests and generate Allure report
        run: ./gradlew clean test -Dselenide.remote=http://localhost:4444/wd/hub allureReport

      # Опционально: сохраняем отчёт как артефакт, чтобы скачать и открыть локально
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-run-\${{ github.run_number }}
          path: build/allure-report/
          retention-days: 7

      # Деплоим отчёт напрямую на GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build/allure-report/
          username: github-actions[bot]
          email: github-actions[bot]@users.noreply.github.com
          force_orphan: false
          keep_files: false